<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="A private, minimal messaging space.">
  <title>Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="app-shell">
    <section id="authView" class="auth-view" aria-labelledby="authTitle">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow">A PRIVATE SPACE</p>
      <h1 id="authTitle">A little room<br>to talk.</h1>
      <p class="muted auth-copy">Enter your private access PIN to continue.</p>
      <form id="loginForm" class="auth-card">
        <label for="pin">Private PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required minlength="6" maxlength="64" placeholder="Enter your PIN">
        <button class="primary-button" type="submit" id="loginButton">Unlock private space <span aria-hidden="true">↗</span></button>
        <p id="authError" class="error-text" role="alert" aria-live="polite"></p>
      </form>
      <p class="tiny-note">Access is limited to authorized people.</p>
    </section>

    <section id="chatView" class="chat-view hidden" aria-label="Private messages">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-mark small" aria-hidden="true"><span></span><span></span><span></span></div>
          <div><p class="eyebrow">PRIVATE SPACE</p><p class="topbar-title">Messages</p></div>
        </div>
        <div class="topbar-actions">
          <span id="connectionStatus" class="status"><i></i> Connecting</span>
          <button id="clearButton" class="icon-button" type="button" aria-label="Clear conversation" title="Clear conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg>
          </button>
          <button id="logoutButton" class="icon-button" type="button" aria-label="Lock and sign out" title="Lock and sign out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4m4-4H9"/></svg>
          </button>
        </div>
      </header>

      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <div class="retention-strip"><span class="retention-dot"></span> Messages expire automatically after 15 minutes</div>
      <div id="messageList" class="message-list" aria-live="polite" aria-label="Messages">
        <div id="emptyState" class="empty-state">
          <div class="empty-orbit"><span></span></div>
          <h2>A quiet beginning.</h2>
          <p>Send a message when you're ready.</p>
        </div>
      </div>
      <form id="composer" class="composer">
        <label class="sr-only" for="messageInput">Write a message</label>
        <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Write something…" autocomplete="off" enterkeyhint="send" required></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg>
        </button>
      </form>
      <p class="composer-footnote">Keep it kind. Keep it private.</p>
    </section>
    <div id="globalToast" class="toast hidden" role="status" aria-live="polite"></div>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
